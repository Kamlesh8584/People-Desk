<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PeopleDesk{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">P</span> PeopleDesk</a>
    {% if session.get('logged_in') %}<form action="{{ url_for('logout') }}" method="post"><button class="signout" type="submit">Sign out</button></form>{% endif %}
  </header>
  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="messages">{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>PeopleDesk <span>•</span> Employee directory</footer>
</body>
</html>
